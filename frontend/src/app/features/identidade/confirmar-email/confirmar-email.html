<uc-auth-shell>
  @switch (estado()) {
    @case ('confirmando') {
      <p class="confirmacao__texto" role="status">Confirmando seu e-mail…</p>
    }
    @case ('confirmado') {
      <h1 class="confirmacao__titulo">E-mail confirmado!</h1>
      <p class="confirmacao__texto">Sua conta está pronta. Você já pode fazer login.</p>
      <a class="confirmacao__link" routerLink="/login">Ir para o login</a>
    }
    @case ('erro') {
      <h1 class="confirmacao__titulo">Não foi possível confirmar</h1>
      <p class="confirmacao__texto confirmacao__texto--erro" role="alert">{{ mensagemErro() }}</p>
      <a class="confirmacao__link" routerLink="/cadastro">Voltar ao cadastro</a>
    }
  }
</uc-auth-shell>
