<uc-auth-shell>
  <h1 class="login__titulo">Entrar</h1>
  <p class="login__subtitulo">Use seu e-mail institucional para entrar na UniCatólica.</p>

  @if (sessaoExpirada) {
    <p class="login__aviso" role="status">Sua sessão expirou. Entre novamente para continuar.</p>
  }

  <form class="login__form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <label class="login__label" for="email">E-mail</label>
    <input
      class="login__campo"
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
    />

    <label class="login__label" for="senha">Senha</label>
    <input
      class="login__campo"
      id="senha"
      type="password"
      formControlName="senha"
      autocomplete="current-password"
    />

    <!--
      O submit fecha a ordem de tabulação e-mail -> senha -> Entrar que a suíte
      e2e (auth-publico.spec.ts) trava: nada focável pode entrar no meio, então o
      link "Criar conta" vem depois do <form>.
    -->
    <button uc-button class="login__enviar" type="submit" [disabled]="enviando()">Entrar</button>
  </form>

  @if (mensagemErro()) {
    <p class="login__erro" role="alert">{{ mensagemErro() }}</p>
  }

  <p class="login__rodape">
    Ainda não tem conta?
    <a class="login__link" routerLink="/cadastro">Criar conta</a>
  </p>
</uc-auth-shell>
