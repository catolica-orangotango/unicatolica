@switch (estado()) {
  @case ('membro') {
    <span class="uc-member-indicator__membro">
      <uc-icon name="check" size="sm" />
      <span>{{ label() }}</span>
    </span>
  }
  @case ('membro-menu') {
    <span class="uc-member-indicator__menu-ancora">
      <button
        #botaoMenu
        uc-button
        variant="secondary"
        type="button"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuAberto()"
        (click)="menuAberto.set(!menuAberto())"
      >
        <uc-icon name="check" size="sm" />
        Membro
        <uc-icon name="down" size="sm" />
      </button>
      <uc-menu
        class="uc-member-indicator__menu"
        rotulo="Opções de participação"
        [itens]="itensMenu"
        [(aberto)]="menuAberto"
        [gatilho]="gatilho()?.nativeElement ?? null"
        (selecionou)="sair.emit()"
      />
    </span>
  }
  @case ('restrito') {
    <span class="uc-member-indicator__restrito">Só para alunos deste curso</span>
  }
  @default {
    <button
      uc-button
      variant="secondary"
      type="button"
      [attr.aria-disabled]="estado() === 'entrando' ? 'true' : null"
      (click)="aoParticipar()"
    >
      @if (estado() === 'entrando') {
        Entrando…
      } @else {
        Participar
      }
    </button>
  }
}
