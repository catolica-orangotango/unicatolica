<!--
  Casca das telas públicas (Story 14.7).
  O <main> é o landmark da tela inteira: as rotas públicas ficam fora da casca
  autenticada (app.routes.ts), então nenhuma outra <main> concorre com esta.
-->
<main class="auth-shell">
  <div class="auth-shell__produto">
    <div class="auth-shell__marca">
      <span class="auth-shell__marca-traco" aria-hidden="true"></span>
      <span class="auth-shell__marca-nome">UniCatólica</span>
    </div>
    <p class="auth-shell__chamada">A rede da sua turma na Católica de Joinville</p>
    <p class="auth-shell__apoio">
      Comunidades do seu curso, publicações, enquetes e avisos num só lugar, feito para o campus.
    </p>
  </div>

  <div class="auth-shell__conteudo">
    <div class="auth-shell__card">
      <ng-content />
    </div>

    <nav class="auth-shell__legal" aria-label="Informações legais">
      <a class="auth-shell__legal-link" routerLink="/privacidade">Privacidade</a>
      <a class="auth-shell__legal-link" routerLink="/termos">Termos de uso</a>
    </nav>
  </div>
</main>
