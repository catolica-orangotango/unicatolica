# PACEXT backend — fundação do projeto (AD-1 a AD-11 da Architecture Spine)
quarkus.application.name=pacext-backend

# Datasource (AD-7 — credenciais só por variável de ambiente)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:pacext}
quarkus.datasource.password=${DB_PASSWORD:pacext}
# URL fixa só em produção. Em dev e teste, sem URL, o Quarkus Dev Services sobe um Postgres
# sozinho via Testcontainers (precisa do Docker rodando) — ver
# docs/decisoes/2026-09-24-identidade-desacoplada.md. Para usar um banco externo em dev
# (ex.: o "db" do docker-compose), defina QUARKUS_DATASOURCE_JDBC_URL.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pacext}
# Mesma versão do docker-compose e do CI até aqui.
quarkus.datasource.devservices.image-name=postgres:16-alpine

# Hibernate ORM — schema é responsabilidade exclusiva do Liquibase (AD-9), nunca gerado automaticamente
quarkus.hibernate-orm.database.generation=none

# Liquibase (AD-9) — changelog mestre com <includeAll>
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.liquibase.migrate-at-start=true

# Contexto "dev" roda changesets de seed (ex.: usuário de teste do login, Story 1.4) em
# ambiente local; changesets sem context (schema real) rodam sempre, em qualquer ambiente.
# Nunca ativar o contexto "dev" em produção.
quarkus.liquibase.contexts=dev
%prod.quarkus.liquibase.contexts=

# Segurança JWT (AD-2) — filtro scaffold em compartilhado.seguranca.JwtSecurityFilter valida
# Authorization: Bearer com claims fixos sub + roles. smallrye.jwt.path.groups mapeia a claim
# "roles" do token para JsonWebToken#getGroups(), como exigido pela AD-2.
# Chave pública lida do conteúdo PEM bruto em JWT_PUBLIC_KEY (nunca de arquivo commitado —
# ver .env.example para como gerar um par local). RNF04/OWASP ASVS: nenhuma chave, de dev
# ou produção, fica versionada no repositório.
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY:}
mp.jwt.verify.issuer=${JWT_ISSUER:https://pacext.unicatolica.edu.br}
smallrye.jwt.path.groups=roles

# Desliga a autenticação proativa da camada HTTP do Quarkus (defeito D2): com
# quarkus-smallrye-jwt no classpath, o mecanismo nativo de autenticação roda ANTES de
# qualquer filtro JAX-RS — inclusive JwtSecurityFilter — e responde 401 com corpo vazio
# para um token com formato de JWT porém inválido, nunca alcançando o envelope de erro
# padrão (AD-5). Sem isso, dois pontos validam autenticação, contrariando a promessa da
# AD-2 de que o filtro é o único. JwtSecurityFilter continua fazendo a autenticação real.
quarkus.http.auth.proactive=false

# Emissão de token no login (módulo identidade, Story 1.4) — chave privada correspondente
# à JWT_PUBLIC_KEY acima, lida de JWT_PRIVATE_KEY (ver JwtSigningKeyProducer).
pacext.jwt.sign.key=${JWT_PRIVATE_KEY:}

# CORS (AD-2/AD-6) — configurado uma única vez, de forma centralizada, nunca por módulo
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# Logs estruturados em produção (AD-10); legível em texto puro no dev local
%prod.quarkus.log.console.json=true
quarkus.log.console.json=false

# Identidade — Story 1.2 (Cadastro)
# [DECISÃO A CONFIRMAR] domínio institucional exato não está definido em nenhum artefato
# de planejamento — ajustar para o domínio real de e-mail acadêmico da CatólicaSC antes
# de qualquer deploy.
identidade.email.dominio-institucional=${EMAIL_DOMINIO_INSTITUCIONAL:catolicasc.edu.br}

# [DECISÃO A CONFIRMAR] política de senha (RF04) não definida nos artefatos de
# planejamento — mínimo aplicado aqui: N+ caracteres, com letra e dígito (ver CadastroService).
identidade.senha.tamanho-minimo=${SENHA_TAMANHO_MINIMO:8}

# Identidade — Story 1.3 (Confirmação de e-mail)
identidade.confirmacao-email.token-validade-horas=${CONFIRMACAO_TOKEN_VALIDADE_HORAS:24}

# URL base do frontend, usada para montar o link de confirmação de e-mail (Story 1.3).
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# E-mail (Story 1.3, DT-4) — trocar de provedor é só configuração, sem mudar código.
# app.email.transporte: smtp (padrão; quarkus-mailer, qualquer provedor via QUARKUS_MAILER_*)
# ou brevo-api (API HTTP da Brevo, para quando a hospedagem bloqueia SMTP — Render free).
# Com smtp e sem QUARKUS_MAILER_HOST, dev/%test usam a mailbox mock do Quarkus (nada sai
# pela rede; a mensagem aparece no log). Variáveis documentadas no .env.example.
app.email.transporte=${EMAIL_TRANSPORTE:smtp}
app.email.remetente=${MAIL_FROM:no-reply@pacext.unicatolica.edu.br}
app.email.remetente-nome=${MAIL_FROM_NOME:UniCatólica}
app.email.brevo.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
app.email.brevo.api-key=${BREVO_API_KEY:}
quarkus.mailer.from=${app.email.remetente-nome} <${app.email.remetente}>
