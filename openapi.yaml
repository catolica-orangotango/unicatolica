openapi: 3.1.0
info:
  title: PACEXT — API UniCatólica
  description: >
    Contrato REST da rede social acadêmica UniCatólica (PACEXT). Fonte de verdade
    acordada entre frontend e backend antes de qualquer lado implementar um endpoint
    novo (AD-4 da Architecture Spine) — nenhum lado avança sem que o endpoint exista
    aqui primeiro.
  version: '0.1.0'

servers:
  - url: http://localhost:8080
    description: Ambiente local (docker-compose, AD-7)

paths:
  /auth/login:
    post:
      operationId: login
      summary: Autentica um usuário e emite uma sessão JWT (RF06/RF07/RF08).
      tags: [Identidade]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciais válidas — sessão emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/registro:
    post:
      summary: Cadastro de aluno com e-mail institucional (Story 1.2)
      description: >
        Rota pública (allowlist AD-2). Persiste o usuário com status "e-mail não
        confirmado" — nenhuma sessão é gerada — e dispara o auto-join à comunidade de
        curso correspondente (RF24.1).
      operationId: cadastrarAluno
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
      responses:
        '201':
          description: Usuário cadastrado, e-mail de confirmação enviado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroResponse'
        # 409: e-mail já possui conta (RF02). 422: domínio externo ao institucional
        # (RF01.3), formato de e-mail/senha fora da política (RF03/RF04), ou idade menor
        # que 18 anos (RF01.1), ou cursoId inexistente/inativo (CURSO_INVALIDO) — o schema Erro.code compartilhado (ver ErroResponse no
        # backend) distingue os cenários; o response object AD-5 é sempre o mesmo por status.
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/ErroValidacao'

  /auth/confirmacao-email/{token}:
    post:
      summary: Confirma o e-mail a partir do link recebido (Story 1.3)
      description: Rota pública (allowlist AD-2). Idempotente para token já confirmado.
      operationId: confirmarEmail
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: E-mail confirmado — usuário já pode fazer login.
        # 404: token inexistente ou já substituído por um reenvio (RF01.2). 422: token expirado.
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/ErroValidacao'

  /auth/confirmacao-email/reenvio:
    post:
      summary: Reenvia o e-mail de confirmação (Story 1.3)
      description: >
        Rota pública (allowlist AD-2). Sempre responde 202, mesmo para e-mail
        inexistente ou já confirmado — nunca revela se a conta existe.
      operationId: reenviarConfirmacaoEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenvioConfirmacaoRequest'
      responses:
        '202':
          description: Solicitação aceita.

  /auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessão do usuário autenticado (Story 1.6, RF10/RF11).
      tags: [Identidade]
      description: >
        Exige token válido (não entra na allowlist do JwtSecurityFilter, AD-2) para
        saber qual usuário deslogar. Invalida imediatamente toda sessão emitida
        (claim iat) até o momento do logout (RF11) — requisições subsequentes com o
        mesmo token, mesmo antes do exp natural, são rejeitadas com 401. Idempotente:
        chamar de novo com um token já invalidado também responde 401, nunca erro.
      responses:
        '204':
          description: Sessão invalidada.
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/refresh:
    post:
      operationId: renovarSessao
      summary: Troca o token atual, ainda válido, por um token novo (KAN-78).
      tags: [Identidade]
      description: >
        A sessão expira por inatividade: o token vale o tempo configurado em
        SESSAO_INATIVIDADE_MINUTOS (padrão 15 minutos), e o frontend chama este
        endpoint enquanto o usuário está ativo para receber um token novo, com o
        mesmo prazo contado a partir de agora. Exige token válido (não entra na
        allowlist do JwtSecurityFilter, AD-2). Token vencido ou invalidado por
        logout (RF11) não renova: responde 401, e o usuário entra de novo. O perfil
        (roles) do token novo é lido do banco, não copiado do token antigo.
      responses:
        '200':
          description: Token novo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /usuarios/me:
    get:
      operationId: obterUsuarioAutenticado
      summary: Retorna os dados do usuário autenticado (RF12).
      tags: [Identidade]
      responses:
        '200':
          description: Dados do próprio usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /usuarios/{id}:
    get:
      operationId: obterUsuarioPorId
      summary: Retorna os dados de um usuário por id — somente perfil MODERADOR (RF13).
      tags: [Identidade]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Dados do usuário solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /comunidades:
    post:
      operationId: criarComunidade
      summary: Cria uma comunidade aberta (Story 2.2, RF21/RF22/RF23)
      tags: [Comunidades]
      description: >
        Toda comunidade criada por aqui é do tipo ABERTA — o corpo não aceita "tipo"
        de propósito (RF21.2: só administrador de plataforma cria comunidade de curso,
        endpoint fora desta fatia, ver docs/decisoes/2026-08-modelo-epico-2-comunidades.md). O criador
        vira administrador da comunidade automaticamente (RF23).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComunidadeRequest'
      responses:
        '201':
          description: Comunidade criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComunidadeResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 409: já existe comunidade com esse nome. 422: nome não informado (RF22).
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/ErroValidacao'
    get:
      operationId: listarComunidades
      summary: Lista e filtra comunidades, paginado (Story 2.5, RF27/RF28)
      tags: [Comunidades]
      parameters:
        - name: tipo
          in: query
          schema:
            type: string
            enum: [CURSO, ABERTA]
        - name: nome
          in: query
          schema:
            type: string
        - name: pagina
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de comunidades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComunidadePageResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '422':
          $ref: '#/components/responses/ErroValidacao'

  /comunidades/minhas:
    get:
      operationId: listarMinhasComunidades
      summary: Lista as comunidades das quais o usuário autenticado é membro (Home)
      tags: [Comunidades]
      description: >
        Sem paginação de propósito — alimenta a seção "Suas comunidades" da Home,
        tende a ser um conjunto pequeno.
      responses:
        '200':
          description: Comunidades do usuário autenticado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComunidadeResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /comunidades/{id}:
    get:
      operationId: obterComunidade
      summary: Detalhe de uma comunidade, incluindo se o usuário é membro (Story 2.5, RF27.1)
      tags: [Comunidades]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Dados da comunidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComunidadeResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      operationId: editarComunidade
      summary: Edita nome/descrição da comunidade — só administrador dela (Story 2.6, RF30)
      tags: [Comunidades]
      description: >
        O corpo não aceita "tipo" de propósito: o tipo (CURSO/ABERTA) é imutável desde a
        criação (RF21.1).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComunidadeRequest'
      responses:
        '200':
          description: Comunidade atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComunidadeResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 403: não é administrador da comunidade. 409: nome já usado por outra comunidade.
        # 422: nome não informado (RF22).
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/ErroValidacao'
    delete:
      operationId: excluirComunidade
      summary: Exclui (logicamente) a comunidade — só administrador dela (Story 2.6, RF31)
      tags: [Comunidades]
      description: >
        Exclusão lógica: a comunidade some das listagens e do detalhe (404) e não aceita mais
        interações; os dados são preservados.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Comunidade excluída.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /comunidades/{id}/membros:
    post:
      operationId: ingressarNaComunidade
      summary: Entra numa comunidade aberta (Story 2.4, RF24/RF25)
      tags: [Comunidades]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Ingresso realizado.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 403: comunidade não é do tipo ABERTA. 409: já é membro (RF25).
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'

  /comunidades/{id}/membros/me:
    delete:
      operationId: sairDaComunidade
      summary: Sai de uma comunidade (Story 2.4, RF26)
      tags: [Comunidades]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Associação removida.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /comunidades/{id}/membros/{usuarioId}:
    delete:
      operationId: removerMembroDaComunidade
      summary: Remove um membro da comunidade — só administrador dela (Story 2.6, RF29)
      tags: [Comunidades]
      description: >
        Só remove quem é membro comum; um administrador (inclusive o próprio solicitante)
        não pode ser removido por aqui, para a comunidade não ficar sem administrador.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: usuarioId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Membro removido.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 403: solicitante não é administrador da comunidade. 404: comunidade ou membro inexistente.
        # 422: o usuário a remover é administrador da comunidade.
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/ErroValidacao'

  /comunidades/{id}/publicacoes:
    post:
      operationId: criarPublicacao
      summary: Cria uma postagem na comunidade (Story 3.1, RF32/RF33/RF34/RF35)
      tags: [Publicacoes]
      description: >
        O autor é sempre o usuário autenticado (RF34) — o corpo não aceita autor nem
        comunidade; a comunidade vem do path (RF35). Só membro da comunidade publica
        (RF27.1), seja ela de curso ou aberta.
      parameters:
        - name: id
          in: path
          required: true
          description: Id da comunidade.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacaoRequest'
      responses:
        '201':
          description: Postagem criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacaoResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 403: usuário não é membro da comunidade (RF27.1). 404: comunidade não existe.
        # 422: conteúdo ausente, em branco ou acima do limite (RF33).
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/ErroValidacao'
    get:
      operationId: listarPublicacoes
      summary: Lista as postagens da comunidade, mais recente primeiro, paginado (Story 3.2, RF36)
      tags: [Publicacoes]
      description: >
        Qualquer usuário autenticado lê o feed, membro ou não (Story 2.5 — não-membro
        vê o feed com a interação bloqueada; quem decide o bloqueio é o souMembro de
        GET /comunidades/{id}). Ordem: criadoEm decrescente, id decrescente no empate.
        Postagem ocultada pela Moderação (Story 12.5, RF78) não aparece nem conta em
        totalElements; volta ao ser restaurada (RF78.1).
      parameters:
        - name: id
          in: path
          required: true
          description: Id da comunidade.
          schema:
            type: integer
            format: int64
        - name: pagina
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de postagens da comunidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacaoPageResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /cursos:
    get:
      operationId: listarCursos
      summary: Lista os cursos ativos da instituição, em ordem alfabética
      tags: [Identidade]
      description: >
        Rota pública (allowlist AD-2): a tela de cadastro precisa da lista antes do
        login. Sem paginação de propósito, como GET /comunidades/minhas — é a lista de um
        select, com poucas dezenas de itens. Cadastro e edição de cursos pelo
        administrador ficam fora deste contrato.
      security: []
      responses:
        '200':
          description: Cursos ativos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'

  /perfil/me:
    get:
      operationId: obterMeuPerfil
      summary: Perfil acadêmico do usuário autenticado (Story 4.2, RF20)
      tags: [Perfil]
      description: >
        Sempre 200: quem ainda não preencheu o perfil acadêmico (Story 4.1) recebe
        nome e curso do cadastro, periodo null e interesses vazio — o front usa
        periodo null para saber que o perfil ainda não foi criado.
      responses:
        '200':
          description: Perfil do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    put:
      operationId: salvarMeuPerfil
      summary: Cria ou edita o perfil acadêmico do usuário autenticado (Story 4.1, RF14–RF19)
      tags: [Perfil]
      description: >
        Substitui o perfil inteiro (cria na primeira vez, RF14). nome e curso ficam no
        cadastro do usuário; periodo e interesses, no perfil acadêmico. cursoId vem de
        GET /cursos. Trocar o curso
        dispara o auto-join da comunidade do novo curso (Story 2.3, RF24.1). Interesses
        repetidos sem diferença de maiúsculas/espaços viram um só.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
      responses:
        '200':
          description: Perfil salvo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 422: nome em branco, cursoId inexistente/inativo (CURSO_INVALIDO), periodo
        # fora de 1–12, mais de 10 interesses ou interesse em branco/acima de 50 caracteres.
        '422':
          $ref: '#/components/responses/ErroValidacao'

  /usuarios/{id}/perfil:
    get:
      operationId: obterPerfilPublico
      summary: Perfil acadêmico público de outro usuário, somente leitura (Story 4.4, RF20.2)
      tags: [Perfil]
      description: >
        Qualquer usuário autenticado. Mesmos campos do próprio perfil, sem e-mail nem
        outro dado sensível (RF20.2). Usuário que ainda não criou o perfil acadêmico
        aparece com periodo null e interesses vazio, como em GET /perfil/me.
      parameters:
        - name: id
          in: path
          required: true
          description: Id do usuário.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Perfil público do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /denuncias:
    post:
      operationId: denunciarConteudo
      summary: Denuncia um conteúdo impróprio, informando o motivo (Story 12.1, RF75, RF76)
      tags: [Moderacao]
      description: >
        Qualquer usuário autenticado que consegue ver o conteúdo pode denunciá-lo — no caso
        da postagem, qualquer um, já que o feed é aberto (Story 2.5). O denunciante é o
        usuário autenticado; ele fica guardado só para barrar denúncia repetida e nunca
        aparece para o moderador (RF77.1). Por enquanto só postagem: comentário (Epic 5) e
        enquete (Epic 8) entram no enum quando os módulos existirem. Triagem pelo agente
        de IA (Story 12.2) e aviso ao moderador (Notificações) ficam fora deste corte.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DenunciaRequest'
      responses:
        '201':
          description: Denúncia registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DenunciaRegistrada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 403: denunciar o próprio conteúdo. 404: conteúdo não existe ou está oculto.
        # 409: o mesmo usuário já denunciou este conteúdo (DENUNCIA_DUPLICADA).
        # 422: motivo ausente, em branco ou acima do limite.
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/ErroValidacao'

  /moderacao/denuncias:
    get:
      operationId: listarDenuncias
      summary: Fila de denúncias do moderador, mais antiga primeiro, paginado (Story 12.4, RF77)
      tags: [Moderacao]
      description: >
        Só perfil MODERADOR (RF13); o administrador de plataforma entra quando o papel
        existir (KAN-44). Nenhum item tem campo com a identidade do denunciante (RF77.1).
        Uma denúncia por item: o mesmo conteúdo denunciado por várias pessoas aparece
        várias vezes, cada uma com o próprio motivo. Ordem: criadoEm crescente, id
        crescente no empate. Com situacao=RESOLVIDA o moderador acha o conteúdo oculto
        para restaurar (RF78.1).
      parameters:
        - name: situacao
          in: query
          description: Filtra pela situação da denúncia.
          schema:
            type: string
            enum: [PENDENTE, RESOLVIDA, DESCARTADA]
            default: PENDENTE
        - name: pagina
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de denúncias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DenunciaPageResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'

  /moderacao/denuncias/{id}:
    get:
      operationId: obterDenuncia
      summary: Denúncia para a tela de análise, sem identidade do denunciante (Story 12.4, RF77.1)
      tags: [Moderacao]
      description: Só perfil MODERADOR.
      parameters:
        - $ref: '#/components/parameters/DenunciaId'
      responses:
        '200':
          description: Denúncia com o conteúdo denunciado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denuncia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /moderacao/denuncias/{id}/ocultacao:
    post:
      operationId: ocultarConteudoDenunciado
      summary: Oculta o conteúdo denunciado, de forma reversível (Story 12.5, RF78)
      tags: [Moderacao]
      description: >
        Só perfil MODERADOR. O conteúdo sai do feed e para de aceitar interações (inclusive
        novas denúncias), mas é preservado (RF78). Resolve esta denúncia e todas as outras
        pendentes do mesmo conteúdo. Registra a ação em acao_moderacao e no log de
        auditoria (AD-11). O motivo é o que o autor recebe (RF78.2, sem identidade do
        denunciante); a notificação em si depende do módulo Notificações e fica fora deste
        corte.
      parameters:
        - $ref: '#/components/parameters/DenunciaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcultacaoRequest'
      responses:
        '200':
          description: Conteúdo ocultado; denúncia resolvida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denuncia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 409: denúncia não está PENDENTE (SITUACAO_INVALIDA). 422: motivo ausente, em branco ou acima do limite.
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/ErroValidacao'

  /moderacao/denuncias/{id}/restauracao:
    post:
      operationId: restaurarConteudoDenunciado
      summary: Restaura o conteúdo ocultado a partir desta denúncia (Story 12.5, RF78.1)
      tags: [Moderacao]
      description: >
        Qualquer MODERADOR, não só quem ocultou (RF78.1). O conteúdo volta a aparecer
        normalmente no feed. A denúncia continua RESOLVIDA; a restauração fica no histórico
        (acao_moderacao) e no log de auditoria. Sem corpo.
      parameters:
        - $ref: '#/components/parameters/DenunciaId'
      responses:
        '200':
          description: Conteúdo restaurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denuncia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 409: o conteúdo desta denúncia não está oculto (SITUACAO_INVALIDA).
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'

  /moderacao/denuncias/{id}/descarte:
    post:
      operationId: descartarDenuncia
      summary: Encerra a denúncia sem ação sobre o conteúdo (Story 12.4)
      tags: [Moderacao]
      description: >
        Só perfil MODERADOR. Para quando o moderador não vê violação: a denúncia sai da
        fila de pendentes e o conteúdo não muda. Só esta denúncia — as outras do mesmo
        conteúdo seguem na fila, cada uma com o próprio motivo. Motivo opcional, só para o
        histórico; ninguém é notificado.
      parameters:
        - $ref: '#/components/parameters/DenunciaId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescarteRequest'
      responses:
        '200':
          description: Denúncia descartada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denuncia'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        # 409: denúncia não está PENDENTE (SITUACAO_INVALIDA).
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'

  /notificacoes/me:
    get:
      operationId: listarMinhasNotificacoes
      summary: Notificações do usuário autenticado, mais recentes primeiro (Story 10.1, RF20.1)
      tags: [Notificacoes]
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            default: 0
        - name: tamanho
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Página de notificações do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacaoPageResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /notificacoes/{id}/lida:
    post:
      operationId: marcarNotificacaoComoLida
      summary: Marca uma notificação do usuário autenticado como lida (Story 10.1)
      tags: [Notificacoes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Marcada como lida.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

components:
  parameters:
    DenunciaId:
      name: id
      in: path
      required: true
      description: Id da denúncia.
      schema:
        type: integer
        format: int64

  schemas:
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password

    LoginResponse:
      type: object
      description: >
        Token JWT com claims sub (id do usuário) e roles (perfil global) — transportado
        daqui em diante via header Authorization: Bearer, nunca cookie (AD-2).
      required: [token]
      properties:
        token:
          type: string

    CadastroRequest:
      type: object
      required:
        - nome
        - email
        - senha
        - cursoId
        - dataNascimento
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
          description: E-mail institucional (RF01.3) — domínio validado no backend.
        senha:
          type: string
          format: password
        cursoId:
          type: integer
          format: int64
          description: >
            Id de um curso de GET /cursos — usado para o auto-join (RF24.1) na
            comunidade do curso (Story 2.1).
        dataNascimento:
          type: string
          format: date

    CadastroResponse:
      type: object
      required:
        - id
        - nome
        - email
        - curso
        - emailConfirmado
        - criadoEm
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        curso:
          type: string
          description: Nome do curso escolhido.
        emailConfirmado:
          type: boolean
        criadoEm:
          type: string
          format: date-time

    ReenvioConfirmacaoRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    Usuario:
      type: object
      description: >
        Dados públicos de um usuário (RF12/RF13) — nunca inclui senha_hash nem outros
        campos além dos listados; edição de perfil é escopo do Épico 4.
      required: [id, nome, email, perfil]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          type: string
          enum: [ALUNO, MODERADOR]
          description: 'Perfil global do usuário (RF13).'
          examples:
            - ALUNO
        curso:
          type: [string, 'null']
          description: Curso informado no cadastro (Story 1.2) — usado na saudação da Home.

    ComunidadeRequest:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
        descricao:
          type: string

    ComunidadeResponse:
      type: object
      required: [id, nome, tipo, criadoEm]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        tipo:
          type: string
          enum: [CURSO, ABERTA]
          description: 'Imutável após a criação (RF21.1).'
        souMembro:
          type: [boolean, 'null']
          description: >
            Se o usuário autenticado é membro desta comunidade (RF27.1) — presente só na
            consulta de uma comunidade específica, ausente nas listagens.
        criadoEm:
          type: string
          format: date-time

    ComunidadePageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ComunidadeResponse'

    PublicacaoRequest:
      type: object
      required: [conteudo]
      properties:
        conteudo:
          type: string
          minLength: 1
          maxLength: 5000
          description: Corpo da postagem (RF33) — texto só com espaços é rejeitado com 422.

    AutorResumo:
      type: object
      description: >
        Nome e curso do autor, vindos de identidade.UsuarioConsulta (AD-3). Sem foto:
        o avatar é montado no front a partir das iniciais do nome.
      required: [id, nome]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        curso:
          type: [string, 'null']

    PublicacaoResponse:
      type: object
      required: [id, comunidadeId, autor, conteudo, criadoEm]
      properties:
        id:
          type: integer
          format: int64
        comunidadeId:
          type: integer
          format: int64
        autor:
          $ref: '#/components/schemas/AutorResumo'
        conteudo:
          type: string
        criadoEm:
          type: string
          format: date-time
          description: Base do horário relativo exibido no feed (RF36).

    PublicacaoPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/PublicacaoResponse'

    NotificacaoResponse:
      type: object
      required: [id, tipo, texto, lida, criadoEm]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [ONBOARDING_PERFIL]
        texto:
          type: string
        link:
          type: [string, 'null']
          description: Rota do front para onde a notificação leva ao ser clicada, ex. "/perfil".
        lida:
          type: boolean
        criadoEm:
          type: string
          format: date-time

    NotificacaoPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/NotificacaoResponse'

    Curso:
      type: object
      description: >
        Curso da instituição, cadastrado por administrador (a lista inicial vem das 26
        comunidades de curso do seed). O nome casa com a comunidade de curso no auto-join.
      required: [id, nome]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string

    PerfilRequest:
      type: object
      required: [nome, cursoId, periodo, interesses]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 200
          description: RF15.
        cursoId:
          type: integer
          format: int64
          description: RF16 — id de um curso de GET /cursos.
        periodo:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: Semestre atual (RF17).
        interesses:
          type: array
          maxItems: 10
          description: RF18 — pode ser vazio (onboarding progressivo, RF20.1).
          items:
            type: string
            minLength: 1
            maxLength: 50

    Perfil:
      type: object
      description: >
        Perfil acadêmico (RF20) — o mesmo schema serve o próprio perfil e o perfil
        público de terceiros (RF20.2): não tem e-mail nem outro dado sensível.
      required: [usuarioId, nome, interesses]
      properties:
        usuarioId:
          type: integer
          format: int64
        nome:
          type: string
        curso:
          anyOf:
            - $ref: '#/components/schemas/Curso'
            - type: 'null'
          description: null só para conta antiga sem curso reconhecido na migração para a lista de cursos.
        periodo:
          type: [integer, 'null']
          format: int32
          minimum: 1
          maximum: 12
          description: null enquanto o perfil acadêmico não foi criado (Story 4.1).
        interesses:
          type: array
          items:
            type: string

    TipoConteudo:
      type: string
      enum: [PUBLICACAO]
      description: >
        Tipo do conteúdo denunciado; o id aponta para o módulo dono (AD-3). COMENTARIO e
        ENQUETE entram quando Discussões e Enquetes existirem.

    DenunciaRequest:
      type: object
      required: [tipoConteudo, conteudoId, motivo]
      properties:
        tipoConteudo:
          $ref: '#/components/schemas/TipoConteudo'
        conteudoId:
          type: integer
          format: int64
          description: Id da postagem denunciada.
        motivo:
          type: string
          minLength: 1
          maxLength: 1000
          description: RF76 — texto só com espaços é rejeitado com 422.

    DenunciaRegistrada:
      type: object
      description: Confirmação para o denunciante — não expõe a fila nem a situação da análise.
      required: [id, criadoEm]
      properties:
        id:
          type: integer
          format: int64
        criadoEm:
          type: string
          format: date-time

    ConteudoDenunciado:
      type: object
      description: >
        O conteúdo como está hoje no módulo dono, com o autor vindo de
        identidade.UsuarioConsulta (AD-3).
      required: [tipo, id, texto, autor, criadoEm, situacao]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoConteudo'
        id:
          type: integer
          format: int64
        texto:
          type: string
          description: Para postagem, o conteudo dela.
        autor:
          $ref: '#/components/schemas/AutorResumo'
        comunidadeId:
          type: [integer, 'null']
          format: int64
          description: Comunidade onde a postagem está.
        criadoEm:
          type: string
          format: date-time
        situacao:
          type: string
          enum: [VISIVEL, OCULTO]
          description: >
            OCULTO depois de ocultado (RF78); decide se a tela mostra "Restaurar". REMOVIDO
            entra com a Story 12.6.

    Denuncia:
      type: object
      description: >
        Denúncia vista pelo moderador. Não existe, de propósito, nenhum campo com a
        identidade do denunciante (RF77.1) — nem id, nem nome.
      required: [id, conteudo, motivo, situacao, criadoEm]
      properties:
        id:
          type: integer
          format: int64
        conteudo:
          $ref: '#/components/schemas/ConteudoDenunciado'
        motivo:
          type: string
          description: Motivo informado pelo denunciante.
        situacao:
          type: string
          enum: [PENDENTE, RESOLVIDA, DESCARTADA]
          description: >
            RESOLVIDA quando houve ação sobre o conteúdo (ocultar); DESCARTADA quando o
            moderador não viu violação. ESCALONADA entra com a Story 12.8.
        criadoEm:
          type: string
          format: date-time
        resolvidaEm:
          type: [string, 'null']
          format: date-time

    DenunciaPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Denuncia'

    OcultacaoRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 1000
          description: RF78.2 — é o que o autor recebe. Texto só com espaços é rejeitado com 422.

    DescarteRequest:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 1000
          description: Opcional, só para o histórico.

    Erro:
      type: object
      description: >
        Envelope de erro padrão (AD-5) — toda resposta de erro de todo endpoint REST
        segue exatamente esta forma, com o status HTTP mapeado por cenário (401 sem
        autenticação, 403/404 conforme a existência do recurso deva ou não ficar
        oculta, 400/422 validação, 409 conflito, 500 erro não tratado).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 'Código estável da condição de erro (ex.: "NAO_AUTENTICADO").'
              examples:
                - NAO_AUTENTICADO
            message:
              type: string
              description: Mensagem legível para exibição/log.
              examples:
                - Autenticação necessária.
            details:
              type: string
              description: 'Detalhes adicionais opcionais (ex.: campo inválido).'

    PageResponse:
      type: object
      description: >
        Envelope de paginação padrão (AD-4) — todo endpoint de listagem referencia
        este componente via $ref, nunca inventa a própria forma de paginar. Como
        OpenAPI não tem genéricos, um endpoint concreto compõe o tipo do item com
        allOf, por exemplo:
          ComunidadePageResponse:
            allOf:
              - $ref: '#/components/schemas/PageResponse'
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comunidade'
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          description: Itens da página atual — cada endpoint concreto especifica o tipo real via allOf.
          items: {}
        page:
          type: integer
          format: int32
          minimum: 0
          description: Número da página atual (0-based).
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Quantidade máxima de itens por página.
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Total de itens em todas as páginas.
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Total de páginas disponíveis.

  responses:
    NaoAutenticado:
      description: Requisição sem autenticação válida (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    SemPermissao:
      description: Autenticado, mas sem permissão para a ação (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso inexistente, ou cuja existência deve ficar oculta (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroValidacao:
      description: Corpo da requisição inválido (400/422).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflito:
      description: Conflito de estado do recurso (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroInterno:
      description: Erro não tratado (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Filtro de segurança JWT global (AD-2) — transporte exclusivamente via header
        Authorization: Bearer, nunca cookie. Claims fixos: sub (id do usuário) e
        roles (perfis globais, RF13).

security:
  - bearerAuth: []
